<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="job application">
    <meta name="keywords" content="HTML, Doctype, Head, Body, Meta, Paragraph, Headings, Strong, Emphasis">
    <meta name="author" content="job application">
    <link rel="stylesheet" href="styles/styles.css">
    <title> JOB APPLICATION</title>
</head>
<body>
    <h1>JOB APPLICATION</h1>
    <h2>FILL THE REQUIRED FIELDS FOR JOB APPLICATION</h2>
<form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">

    <label for="jobreference">JOB REFERENCE</label>
    <select name="number" id="jobreference">
        <option value="select">select</option>
        <option value="101">101</option>
        <option value="102">102</option>
        <option value="103">103</option>
        <option value="104">104</option>
    </select>
    <fieldset>
        <legend>Personal Details</legend>
        <p><label for="Firstname">First name</label>
        <input type="text" name="Firstname" id="Firstname"  maxlength="20" required></p>
        <p><label for="Lastname">Last name</label>
           <input type="text" name="Lastname" id="Lastname"  maxlength="20" required></p>
            <p>
    
                <label for="dob">Date of birth</label>
                <input type="date" name="dob" id="dob"></p>
                <p><label for="streetaddress">Street Address</label><br>
                    <input type="text" name="streetaddress" id="streetaddress" maxlength="40"></p>
                    <p><label for="suburb">Suburb/town</label>
                        <input type="text" name="suburb" id="suburb" maxlength="40"></p>
                        <p> <label for="state"> State</label>
                            <select name="state" id="state">
                                <option value="VIC" selected>VIC</option> <!-- used chatgpt for this particular-->
                                <option value="NSW">NSW</option>
                                <option value="QLD">QLD</option>
                                <option value="NT">NT</option>
                                <option value="WA">WA</option>
                                <option value="SA">SA</option>
                                <option value="TAS">TAS</option>
                                <option value="ACT">ACT</option>
                            </select>
                        </p><br>
                        
                        <p> <label for="Postcode">Postcode</label>
                            <input type="number" name="Postcode" id="Postcode"></p>
                            <p><label for="email">Email Address</label>
                                <input type="email" name="email" id="email" required></p>
                                <p> <label for="phonenumber"> Phone number</label>
                                    <input type="number" name="phonenumber" id="phonenumber" placeholder="eg-9496102189"></p><br>
                                </fieldset>

                                
                                    <h2>REQUIRED SKILLS</h2> 
                                    <p><label for="NetworkingProtocols">Networking Protocols</label>
                                    <input type="checkbox" name="NetworkingProtocols" id="NetworkingProtocols" checked="checked"></p>
                                    <p><label for="HardwareKnowledge">Hardware Knowledge</label>
                                        <input type="checkbox" name="HardwareKnowledge" id="HardwareKnowledge"></p>
                                        <p><label for="OperatingSystems">Operating Systems</label>
                                            <input type="checkbox" name="OperatingSystems" id="OperatingSystems"></p>
                                            <p><label for="NetworkConfiguration&Troubleshooting">Network Configuration & Troubleshooting</label>
                                                <input type="checkbox" name="NetworkConfiguration&Troubleshooting" id="NetworkConfiguration&Troubleshooting"></p>
                                                <p><label for="CloudNetworking">Cloud Networking</label>
                                                    <input type="checkbox" name="CloudNetworking" id="CloudNetworking"></p>
                                                    <p><label for="SecurityFundamentals">Security Fundamentals</label>
                                                    <input type="checkbox" name="SecurityFundamentals" id="SecurityFundamentals"></p>
                                                    <p><label for="description">Other Skills</label><br>
                                                        <textarea name="description" id="description" rows="4" cols="40" placeholder="Other Skills"></textarea>
                                                        <br></p>
                                
                                    

            <input id="sbutton" type= "submit" value="APPLY">
            <input id="rbutton" type= "reset" value="RESET">
    
</form>


    
</body>
